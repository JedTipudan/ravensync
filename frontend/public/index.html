<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0f0f1a"/>
  <meta name="description" content="RavenSync - Real-time Emergency Communication & Disaster Response Platform"/>
  <title>RavenSync — Emergency Communication Platform</title>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="icon" href="/images/logo.png" type="image/png"/>
  <script src="/vendor/tailwind.min.js"></script>
  <script src="/vendor/chart.min.js"></script>
  <link rel="stylesheet" href="/vendor/fontawesome.min.css"/>
  <link rel="stylesheet" href="/vendor/fonts.css"/>
  <link rel="stylesheet" href="/css/main.css"/>
</head>
<body class="bg-[#f8fafc] text-slate-900 font-inter antialiased">
  <script>
    // Force unregister old broken service workers
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(reg => reg.unregister());
      });
    }
  </script>
  <div id="app"></div>
  <div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-2 pointer-events-none"></div>
  <div id="modal-container"></div>
  <script src="/js/app.js" type="module"></script>
</body>
</html>
